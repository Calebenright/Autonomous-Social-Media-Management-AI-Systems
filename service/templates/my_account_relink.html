{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Sign In - Feadl.io</title>
    <meta name="description" content="Feadlio - Elevate your marketing strategy with Feadl.io, leveraging cutting-edge AI to automate social media and digital marketing for growth and efficiency.">
    <meta name="keywords" content="AI marketing, digital transformation, social media automation, marketing technology, AI-driven analytics, online marketing tools">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://www.feadl.io/">
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'website/media/favicon-32.ico' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'website/media/favicon-16.ico' %}">
    <link rel="manifest" href="{% static 'website/media/seo/site.webmanifest' %}">
    <link rel="shortcut icon" href="{% static 'website/media/favicon.ico' %}">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="msapplication-config" content="{% static 'website/media/browserconfig.xml' %}">
    <meta name="theme-color" content="#ffffff">
  
    <link rel="stylesheet" href="{% static 'service/css/main.css' %}">
  
    <meta property="og:type" content="website">
    <meta property="og:title" content="Feadl.io">
    <meta property="og:description" content="Feadlio - Elevate your marketing strategy with Feadl.io">
    <meta property="og:image" content="{% static 'website/media/seo/og-image.png' %}">
    <meta property="og:image:alt" content="Feadl.io">
    <meta property="og:url" content="https://www.feadl.io/">
    <meta property="og:site_name" content="Feadlio">
    <meta property="og:locale" content="en_US">
  
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Feadl.io">
    <meta name="twitter:description" content="Feadlio - Elevate your marketing strategy with Feadl.io">
    <meta name="twitter:image" content="{% static 'website/media/seo/twitter-image.png' %}">
    <meta name="twitter:image:alt" content="Feadl.io">
  
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-K42FBSFS');</script>
    <!-- End Google Tag Manager -->
  </head>
  
<body class="page page-home preload">
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K42FBSFS" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <header class="topbar">
      <img src="{% static 'website/media/white.png' %}" alt="Company Logo" class="logo">
      <div class="user-email">{{ lead.email }}</div>
  </header>
  <main>
      {% if messages %}
      <section class="messages-section">
        <ul class="messages">
            {% for message in messages %}
            <li class="{{ message.tags }}" data-message-id="{{ forloop.counter }}">
                {{ message }}
                <span class="closebtn" onclick="closeMessage(this);">&times;</span>
            </li>
            {% endfor %}
        </ul>
      </section>
      {% endif %}  
      <form action="{% url 'my_account_relink' %}" method="POST">
        {% csrf_token %}
        <input type="hidden" id="selectedImage" name="selectedImage">
        <section class="form-section shadow login">
          <div class="dashboard">
            <h1>Sign in with email.</h1>
            <br>
            <div class="form-group">
              <label for="email" style="color: #2b3a8a;">Email:</label>
              <input type="email" id="email" name="email">
            </div>
          </div>
          <button type="submit">Save</button>
        </section>
      </form>
  </main>
  <script src="{% static 'service/js/main.js' %}"></script>
</body>
</html>
