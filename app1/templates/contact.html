<body class="page page-onboarding preload">
  <main>

    <a href="{% url 'index' %}" class="button button-close" role="button"></a>

    <section class="row no-gutter reverse-order">
      <div class="col-one-half middle padding">
      {% if error %}
        <div class="error-message">
          <span>{{ error }}</span>
          <button class="close-button" onclick="closeErrorMessage()">&times;</button>
        </div>
      {% endif %}
      {% if success %}
      <div class="success-message">
        <span>{{ success }}</span>
        <button class="close-button" onclick="closeSuccessMessage()">&times;</button>
      </div>
    {% endif %}
      <script>
        function closeErrorMessage() {
          const errorDiv = document.querySelector('.error-message');
          errorDiv.style.display = 'none';
        }
        function closeSuccessMessage() {
          const successDiv = document.querySelector('.success-message');
          successDiv.style.display = 'none';
        }
      </script>
      
        <div class="max-width-s">
          <h1>Contact Us</h1>
          <p class="paragraph">Send us an email and we will get back to you ASAP.</p>
          <!-- <p class="paragraph muted">CJ - Founder & CEO</p> -->
          <form method="POST" action="{% url 'contact' %}">
            {% csrf_token %}
            
            <div class="form-group">
              <label for="text">Name:</label>
              <input id="text" type="text" name="name" required>
            </div>
            <div class="form-group">
              <label for="email">Email:</label>
              <input id="email" type="email" name="email" required>
            </div>
            <div class="form-group">
              <label for="text">Message:</label>
              <input id="text" type="text" name="message" required>
            </div>
            <button type="submit" class="button button-primary full-width space-top" role="button">Send</button>
          </form>
        </div>
        <div class="center max-width-s">
          
          <br>
          <span class="muted">Back To </span><a href="{% url 'index' %}">Home</a>
        </div>
      </div>
      <div class="col-one-half bg-image-03 featured-image"></div>
    </section>

  </main>

  <script src="{% static 'website/js/main.js' %}"></script>
</body>
