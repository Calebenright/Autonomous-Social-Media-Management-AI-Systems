        .header-main {
          position: absolute;
        }
      }
    </style>
    <nav>
      <a href="{% url 'agency_form' %}" class="logo" rel="home">
        <svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"

  </header>

  <main>
    <section class="bg-gradient-dark-flipped overlay dark" style="min-height: 100vh;">
      <div class="margin-top max-width-o" style="margin-top: 8rem;">
        <div class="margin-bottom">
          {% if messages %}
          <ul class="messages">
              {% for message in messages %}
                  <li class="{{ message.tags }}" data-message-id="{{ forloop.counter }}">
                      {{ message }}
                      <span class="closebtn" onclick="closeMessage(this);">&times;</span>
                  </li>
              {% endfor %}
          </ul>
          {% endif %}  
          <h3 class="center">Are you an agency?</h3>
          <br>
          <div class="card">
            <form method="POST" action="{% url 'agency_form' %}">
              {% csrf_token %}
              <div class="form-row">
                <div class="form-group">
                  <label for="email">Feadl.io Email</label>
                  <input type="text" id="email" name="email">
                </div>
                <div class="form-group">
                  <label for="password">Feadl.io Password</label>
                  <input type="text" id="password" name="password">
                </div>
              </div>
              <button type="submit" class="button button-primary full-width space-top" role="button">Switch to agency account</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer-main bg-gradient-primary padding dark overlay-shape-06">
  </footer>
  <script src="{% static 'funnel/form.js' %}"></script>
</body>

</html>
