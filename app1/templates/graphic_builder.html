{% load static %}
<!doctype html>
<html lang="en">
<head>
  <title>Feadl.io | Graphic builder</title> 
  <meta charset="utf-8">
  <meta name="description"
    content="An Autonomous, AI driven, marketing and social media web based application.">
  <meta name="viewport" content="width=device-width">
  <link rel="apple-touch-icon-precomposed" href="{% static 'website/media/favicon.ico' %}">
  <link rel="icon" href="{% static 'website/media/favicon.ico' %}">
  <link rel="mask-icon" href="{% static 'website/media/favicon.svg' %}" color="rgb(36,38,58)">
  <link rel="shortcut icon" href="{% static 'website/media/favicon.png' %}">
  <link rel="stylesheet" href="{% static 'website/css/main.css' %}">
  <link rel="stylesheet" href="{% static 'website/css/builder.css' %}">
</head>

<body class="page page-home preload">

  <header class="header-main light">
    <nav>
      <a href="{% url 'index' %}" class="logo" rel="home">

          <g>
            <path d="M113.2,143.6v90.7c0,3.8-3.1,6.9-6.9,6.9H15.6c-3.8,0-6.9-3.1-6.9-6.9v-90.7c0-3.8,3.1-6.9,6.9-6.9h90.7
              C110.1,136.7,113.2,139.9,113.2,143.6z"/>

              C238.2,8.7,241.2,11.8,241.2,15.6z"/>
          </g>
          <g>
            <path d="M177.2,207.6v26.7c0,3.8-3.1,6.9-6.9,6.9h-26.7c-3.8,0-6.9-3.1-6.9-6.9v-26.7c0-3.8,3.1-6.9,6.9-6.9h26.7

            <path d="M241.2,207.6v26.7c0,3.8-3.1,6.9-6.9,6.9h-26.6c-3.8,0-6.9-3.1-6.9-6.9v-26.7c0-3.8,3.1-6.9,6.9-6.9h26.7

          <g>
            <path d="M241.2,143.6v26.7c0,3.8-3.1,6.9-6.9,6.9h-90.7c-3.8,0-6.9-3.1-6.9-6.9v-26.7c0-3.8,3.1-6.9,6.9-6.9h90.7

      </svg>
        <!-- <img src="{% static 'website/media/WhiteLetteringLogo.svg' %}" alt="Feadl.io Logo" > -->
        <span style="vertical-align:middle">Feadl.io</span>
      </a>
      <div class="nav-toggle"></div>
      <ul class="inline right">
        <li><a href="{% url 'login' %}">Log In</a></li>
        <li><a href="{% url 'signup' %}" class="button button-secondary button-m full-width-tablet" role="button">Sign Up</a>
        </li>
      </ul>
    </nav>
  </header>
    <main>
        <section class="-margin-bottom-2 overlay padding">
         <div class="parent-container">
            <div class="left-side">
                <canvas id="canvas" width="1024" height="1024"></canvas>
            </div>
            <div class="right-side">
                
                <div class="div-container">
                    <input type="file" id="imageUpload" accept="image/png, image/jpeg, image/svg+xml">
                    <div id="dimensionSelector">
                      <label for="canvasDimensions">Select Canvas Size:</label>
                      <select id="canvasDimensions">
                          <option value="1024x1024">1024x1024</option>
                          <option value="1080x1080">1080x1080</option>
                          <option value="1080x1350">1080x1350</option>
                          <option value="1280x720">1280x720</option>
                      </select>
                    </div>
                    <br>
                    <div id="textBoxControls">
                        <button id="createTextBox">Create Text Box</button>
                        <button id="deleteTextBox">Delete Selected Text Box</button>
                        <button id="applyText">Apply Text</button>\
                    </div>
                    <br>
                    <div id="logoBoxControls">
                        <button id="createLogo">Create Logo Box</button>
                        <button id="deleteLogo">Delete Logo Box</button>
                    </div>
                    <br>
                    <div id="imgBoxControls">
                        <button id="createImg">Create Image Box</button>
                        <button id="deleteImg">Delete Image Box</button>
                    </div>
                    <br>
                    <div id="textBoxControls">
                        <input type="text" id="modifyText" placeholder="Modify Text">
                    </div>
                    <br>
                    <button onclick="downloadJSON()">Download Settings</button>
                    <br>
                </div>
                <br>
                <div class="div-container">
                    <label for="fontSize">Font Size:</label>
                    <input type="number" id="fontSize" value="60">
                    <br>
                    <label for="customFont">Font:</label>
                    <select id="customFont">
                        <option value="BergenText">BergenText Regular</option>
                        <option value="Kanit">Kanit Thin</option>
                        <option value="LilitaOne">LilitaOne</option>
                        <option value="Montserrat">Montserrat</option>
                        <option value="AmaticSC">Amatic SC Regular</option>
                        <option value="Alata">Alata Regular</option>
                        <option value="Cantarell">Cantarell</option>
                        <option value="Caveat">Caveat</option>
                        <option value="FuturaCyrillic">Futura Cyrillic</option>
                        <option value="NoticiaText">Noticia Text</option>
                        <option value="Oswald">Oswald</option>
                        <option value="Prata">Prata</option>
                        <option value="RobotoMono">Roboto Mono</option>
                        <option value="Poppins">Poppins</option>
                    </select>
                    <br><br>
                    <label for="textAlign">Text Alignment:</label>
                    <select id="textAlign">
                        <option value="left">Left</option>
                        <option value="center">Center</option>
                        <option value="right">Right</option>
                    </select>
                    <br><br>
                    <label for="anchorPoint">Anchor Point:</label>
                    <select id="anchorPoint">
                        <option value="top-left">Top-Left</option>
                        <option value="center">Center</option>
                        <option value="top-right">Top-Right</option>  <!-- Updated value and label -->
                    </select>
                    <br><br>
                    <label for="fontWeight">Weight:</label>
                    <select id="fontWeight">
                        <option value="100">Thin - 100</option>
                        <option value="200">Extra Light - 200</option>
                        <option value="300">Light - 300</option>
                        <option value="400" selected>Normal - 400</option>
                        <option value="500">Medium - 500</option>
                        <option value="600">Semi-Bold - 600</option>
                        <option value="700">Bold - 700</option>
                        <option value="800">Extra Bold - 800</option>
                        <option value="900">Black - 900</option>
                    </select>
                    <br><br>
                    <label for="lineHeight">Line Height:</label>
                    <input type="number" id="lineHeight" value="1.2">
                    <br>
                    <!-- <label for="charSpacing">Character Spacing:</label> -->
                    <input type="hidden" id="charSpacing" value="0">
                </div>
                <br>
                <div class="div-container">

                    <label for="textColor">Text Color:</label>
                    <select id="textColor">
                        <option value="ai">AI</option>
                        <option value="secondary">Secondary</option>
                        <option value="primary">Primary</option>
                        <option value="black">Black</option>
                        <option value="white">White</option>
                        <option value="lighter">Lighter</option>
                        <option value="darker">Darker</option>
                    </select>
                    <label for="maxCharCount">Max Char Count:</label>
                    <input type="number" id="maxCharCount" name="maxCharCount" value="40">
                    <br>
                    <label for="promptSelection">AI Prompt:</label>
                    <select id="promptSelection">
                        <option value="Headline">Headline</option>
                        <option value="Description">Description</option>
                        <option value="Call-to-action">Call-to-action</option>
                    </select>
                    <br>
                    <br>
                    <label for="blurAmount">Blur Amount:</label>
                    <input type="range" id="blurAmount" name="blurAmount" min="0" max="10" value="0">
                    <br>
                    <br>
                    <label for="isImage">Is Image Present?</label>
                    <input type="checkbox" id="isImage" checked>
                    <br>
                    <label for="isLogo">is Logo:</label>
                    <input type="checkbox" id="isLogo" name="isLogo" value="true">
                    <br>
                    <label for="isBlur">is Blur:</label>
                    <input type="checkbox" id="isBlur" name="isBlur" value="true">
                </div>
                <br>
            </div>
        </div>
        </section>
    </main>
  <script src="{% static 'website/js/builder.init.js' %}"></script>
  <script src="{% static 'website/js/main.js' %}"></script>
</body>

</html>
