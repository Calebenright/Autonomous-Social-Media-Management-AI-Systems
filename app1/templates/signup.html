{% load static %}
<!doctype html>
<html lang="en">

<head>
  <title>Feadl.io | Sign Up</title>
  <meta name="description" content="Elevate your marketing strategy with Feadlio, leveraging cutting-edge AI to automate social media and digital marketing for growth and efficiency.">
  <meta name="keywords" content="AI marketing, digital transformation, social media automation, marketing technology, AI-driven analytics, online marketing tools">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://www.feadl.io/">
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
  
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'website/media/favicon-32.ico' %}">
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'website/media/favicon-16.ico' %}">
  <link rel="manifest" href="{% static 'website/media/seo/site.webmanifest' %}">
  <link rel="shortcut icon" href="{% static 'website/media/favicon.ico' %}">
  <meta name="msapplication-TileColor" content="#da532c">
  <meta name="msapplication-config" content="{% static 'website/media/browserconfig.xml' %}">
  <meta name="theme-color" content="#ffffff">

  <link rel="stylesheet" href="{% static 'website/css/main.css' %}">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Feadlio | Transform Your Marketing with Our AI-Driven Platform">
  <meta property="og:description" content="Elevate your marketing strategy with Feadlio, leveraging cutting-edge AI to automate social media and digital marketing for growth and efficiency.">
  <meta property="og:image" content="{% static 'website/media/seo/og-image.png' %}">
  <meta property="og:image:alt" content="Feadlio's AI-driven marketing platform interface">
  <meta property="og:url" content="https://www.feadl.io/">
  <meta property="og:site_name" content="Feadlio">
  <meta property="og:locale" content="en_US">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Feadlio | Transform Your Marketing with Our AI-Driven Platform">
  <meta name="twitter:description" content="Elevate your marketing strategy with Feadlio, leveraging cutting-edge AI to automate social media and digital marketing for growth and efficiency.">
  <meta name="twitter:image" content="{% static 'website/media/seo/twitter-image.png' %}">
  <meta name="twitter:image:alt" content="Feadlio's AI-driven marketing platform interface">

  <script type="application/ld+json">
  {
    "@context": "http://schema.org",
    "@type": "SoftwareApplication",
    "name": "Feadlio",
    "description": "Feadlio is an AI-driven marketing and social media platform that automates and optimizes digital marketing campaigns.",
    "url": "https://www.feadl.io/",
    "image": "{% static 'website/media/seo/schema-image.png' %}",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    }
  }
  </script>
  <!-- Meta Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '7170700856358682');
    fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=7170700856358682&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->
</head>

<body class="page page-onboarding preload">
  <main>

    <a href="{% url 'index' %}" class="button button-close" role="button"></a>

    <section class="row no-gutter reverse-order">
      <div class="col-one-half middle padding">
        {% if error %}
        <div class="error-message">
          <span>{{ error }}</span>
          <button class="close-button" onclick="closeErrorMessage()">&times;</button>
        </div>
      {% endif %}
      {% if success %}
      <div class="success-message">
        <span>{{ success }}</span>
        <button class="close-button" onclick="closeSuccessMessage()">&times;</button>
      </div>
      {% endif %}
        <script>
          function closeErrorMessage() {
            const errorDiv = document.querySelector('.error-message');
            errorDiv.style.display = 'none';
          }
          function closeSuccessMessage() {
            const successDiv = document.querySelector('.success-message');
            successDiv.style.display = 'none';
          }
        </script>
      
        <div class="max-width-s">
          <h1>Feadl.io</h1>
          <p class="paragraph">More Sales. Less Effort.</p>
          <form method="POST" action="{% url 'signup' %}">
            {% csrf_token %}
            <div class="form-group">
              <label for="email">Email:</label>
              <input id="email" type="email" name="email" required>
            </div>
            <div class="form-group">
              <label for="email">Confirm Email:</label>
              <input id="emailConfirm" type="email" name="confirm_email" required>
            </div>
            <div class="form-group">
              <label for="password">Password:</label>
              <input id="password" type="password" name="password" required>
            </div>
            <button type="submit" class="button button-primary full-width space-top" role="button">Join The Beta</button>
          </form>
        </div>
        <div class="center max-width-s space-top">
          <span class="muted">By creating an account, you agree to our </span><a href="{% url 'terms_of_service' %}">Terms</a><span
            class="muted">.</span>
        </div>
        <div class="center max-width-s">
          <span class="muted">Already have an account? </span><a href="{% url 'login' %}">Log In</a>
        </div>
      </div>
      <div class="col-one-half bg-image-05 featured-image"></div>
    </section>

  </main>

  <script src="{% static 'website/js/main.js' %}"></script>
</body>

</html>
