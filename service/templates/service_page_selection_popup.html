{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="robots" content="noindex">
    <meta charset="UTF-8">
    <title>Select Your Page</title>
    <style>
        body, h2, form, button {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .popup {
            background: #fff;
            padding: 20px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.2);
            border-radius: 10px;
            min-width: 300px;
        }

        h2 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        form div {
            margin-bottom: 10px;
        }

        label {
            margin-left: 10px;
            font-size: 16px;
            color: #555;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo img {
            max-width: 100px; 
        }

        .muted-text {
            color: #777;
            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 25px;
            background-color: #4CAF50; 
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }

        button:hover {
            background-color: #45a049; 
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="overlay">
    <div class="popup">
        <div class="logo">
            <img src="{% static 'dashboard/images/brand/logo-dark.png' %}" alt="Logo">
        </div>
        <div class="muted-text">Feadl.io needs some more info:</div>
        <h2>Select a Page</h2>
        <form id="pageSelectForm" action="{% url 'funnel_process_page_selection' %}" method="post">
            {% csrf_token %}
            {% for page in pages %}
            <div>
                <input type="radio" id="page{{ forloop.counter }}" name="pageId" value="{{ page.id }}" required onclick="setPageName('pageName{{ forloop.counter }}', 'pageToken{{ forloop.counter }}', 'pageType{{ forloop.counter }}')">
                <label for="page{{ forloop.counter }}">{{ page.name }}</label>
                <input type="hidden" id="pageName{{ forloop.counter }}" value="{{ page.name }}">
                <input type="hidden" id="pageToken{{ forloop.counter }}" value="{{ page.access_token }}">
                <input type="hidden" id="pageType{{ forloop.counter }}" value="{{ page.type }}">
            </div>
            {% endfor %}
            <br>
            <br>
            <input type="hidden" id="pageName" name="pageName" value="">
            <input type="hidden" id="pageToken" name="pageToken" value="">
            <input type="hidden" id="pageType" name="pageType" value="">
            <input type="hidden" id="provider" name="provider" value="{{ provider }}">
            <button type="submit">Select Page</button>
        </form>
        
        <script>
            function setPageName(pageNameId, pageTokenId, pageTypeId) {
                var pageName = document.getElementById(pageNameId).value;
                var pageToken = document.getElementById(pageTokenId).value;
                var pageType = document.getElementById(pageTypeId).value;
                document.getElementById('pageName').value = pageName;
                document.getElementById('pageToken').value = pageToken;
                document.getElementById('pageType').value = pageType;
            }
        </script>        
    </div>
</div>


</body>
</html>
