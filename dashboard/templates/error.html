{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="robots" content="noindex">
        <meta charset="utf-8" />
        <title>Error | Feadl.io </title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta content="A automonomous social media managing app and ad agency" name="description" />
        <meta content="CJ Enright" name="author" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <!-- App favicon -->
        <link rel="shortcut icon" href="{% static 'dashboard/images/favicon.ico' %}">

		<!-- App css -->

		<link href="{% static 'dashboard/css/app.min.css' %}" rel="stylesheet" type="text/css" id="app-style" />

		<!-- icons -->
		<link href="{% static 'dashboard/css/icons.min.css' %}" rel="stylesheet" type="text/css" />

    </head>

    <body class="loading authentication-bg authentication-bg-pattern">

        <div class="account-pages mt-5 mb-5">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-8 col-lg-6 col-xl-5">
                        <div class="text-center">
                            <a href="{% url 'dashboard' %}" class="logo">
                                <img src="{% static 'dashboard/images/brand/logo-dark.png' %}" alt="" height="22" class="logo-light mx-auto">
                            </a>
                            <br>
                        </div>
                        <div class="card">

                            <div class="card-body p-4">

                                <div class="text-center">
                                    <h1 class="text-error">500</h1>
                                    <h3 class="mt-3 mb-2">Oops! Something happened.</h3>
                                    <h3 class="mt-3 mb-2">{{ error }}</h3>
                                    <p class="text-muted mb-3">If the problem persists, please can contact <a href="{% url 'contact' %}" class="text-dark"><b>Support</b></a></p>

                                    <a href="{% url 'dashboard' %}" class="btn btn-danger waves-effect waves-light"><i class="fas fa-home me-1"></i> Back to Dashboard</a>
                                </div>
    

                            </div> <!-- end card-body -->
                        </div>
                        <!-- end card -->

                    </div> <!-- end col -->
                </div>
                <!-- end row -->
            </div>
            <!-- end container -->
        </div>
        <!-- end page -->

        <!-- Vendor -->
        <script src="{% static 'dashboard/libs/jquery/jquery.min.js' %}"></script>
        <script src="{% static 'dashboard/libs/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
        <script src="{% static 'dashboard/libs/simplebar/simplebar.min.js' %}"></script>
        <script src="{% static 'dashboard/libs/node-waves/waves.min.js' %}"></script>
        <script src="{% static 'dashboard/libs/waypoints/lib/jquery.waypoints.min.js' %}"></script>
        <script src="{% static 'dashboard/libs/jquery.counterup/jquery.counterup.min.js' %}"></script>
        <script src="{% static 'dashboard/libs/feather-icons/feather.min.js' %}"></script>

        <!-- App js -->
        <script src="{% static 'dashboard/js/app.min.js' %}"></script>
        
    </body>
</html>
