  <meta property="og:type" content="website">

    "image": "{% static 'website/media/seo/schema-image.png' %}",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    }

<body class="page page-onboarding preload">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K42FBSFS"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    
    <a href="{% url 'index' %}" class="button button-close" role="button"></a>

    <section class="row no-gutter reverse-order">
      <div class="col-one-half middle padding">
        <div id="error-messages-container"></div>
        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li class="{{ message.tags }} {% if message.tags == 'info' %}info-message{% endif %}" data-message-id="{{ forloop.counter }}">
                    {{ message }}
                    <span class="closebtn" onclick="closeMessage(this);">&times;</span>
                </li>
            {% endfor %}
        </ul>
        {% endif %}    
      
        <div class="max-width-s">

          <h1>Feadl.io</h1>
          <p class="paragraph">Passive. Social Media Management.</p>
          <form method="POST" action="{% url 'login' %}" id="loginForm">
            {% csrf_token %}
            <div class="form-group">
              <label for="email">Email:</label>
              <input id="email" type="text" name="email" required>
            </div>
            <div class="form-group">
              <label for="password">Password:</label>
              <input id="password" type="password" name="password" required>
              <a href="{% url 'forgot_password' %}" class="form-help">Forgot password?</a>
            </div>
          </form>
          <button type="button" class="button button-primary full-width" role="button" id="feadlio-sign-in">Log In</button>
          <br>
          <br>
        </div>
        <div class="center max-width-s space-top">
          <span class="muted">Don't have an account?   </span><a href="{% url 'signup' %}">Sign Up</a>
          <br>
          <span class="muted">Forgot Your Password?   </span><a href="{% url 'forgot_password' %}">Reset Password</a>
        </div>
      </div>
      <div class="col-one-half bg-image-04 featured-image"></div>
    </section>
    <!-- Loader Container -->
    <div id="loader" class="loader-container" style="display:none;">
      <div class="loader-dot"></div>
    </div>
    <style>
      /* Loader container covering the entire screen with white opaque background */
      .loader-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(255, 255, 255, 0.8); /* White with opacity */
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000; /* Ensure it's above other content */
      }

      /* Blue dot loader */
      .loader-dot {
        width: 20px;
        height: 20px;
        background-color: rgb(69, 139, 219);
        border-radius: 50%;
        animation: pulse 2s infinite;
      }

      /* Animation for the blue dot */
      @keyframes pulse {
        0%, 100% {
          transform: scale(.1);
        }
        50% {
          transform: scale(1.5);
        }
      }
    </style>
  </main>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <script src="{% static 'website/js/main.js' %}"></script>
  <script type="module" src="{% static 'website/js/login.js' %}"></script>

</body>

</html>
