{% load static %}
<!doctype html>
<html lang="en">

<head>
  <title>Sign Up | Feadl.io</title>
  <meta charset="utf-8">
  <meta name="description"
   content="An Autonomous, AI driven, marketing and social media web based application.">
  <meta name="viewport" content="width=device-width">
  <link rel="apple-touch-icon-precomposed" href="{% static 'website/media/favicon.ico' %}">
  <link rel="icon" href="{% static 'website/media/favicon.ico' %}">
  <link rel="mask-icon" href="{% static 'website/media/favicon.svg' %}" color="rgb(36,38,58)">
  <link rel="shortcut icon" href="{% static 'website/media/favicon.png' %}">
  <link rel="stylesheet" href="{% static 'website/css/main.css' %}">
</head>

<body class="page page-onboarding preload">
  <main>

    <a href="{% url 'index' %}" class="button button-close" role="button"></a>

    <section class="row no-gutter reverse-order">
      <div class="col-one-half middle padding">
        {% if error %}
        <div class="error-message">
          <span>{{ error }}</span>
          <button class="close-button" onclick="closeErrorMessage()">&times;</button>
        </div>
      {% endif %}
      {% if success %}
      <div class="success-message">
        <span>{{ success }}</span>
        <button class="close-button" onclick="closeSuccessMessage()">&times;</button>
      </div>
      {% endif %}
        <script>
          function closeErrorMessage() {
            const errorDiv = document.querySelector('.error-message');
            errorDiv.style.display = 'none';
          }
          function closeSuccessMessage() {
            const successDiv = document.querySelector('.success-message');
            successDiv.style.display = 'none';
          }
        </script>
      
        <div class="max-width-s">
          <h1>Feadl.io</h1>
          <p class="paragraph">More Sales. Less Effort.</p>
          <form method="POST" action="{% url 'signup' %}">
            {% csrf_token %}
            <div class="form-group">
              <label for="email">Email:</label>
              <input id="email" type="email" name="email" required>
            </div>
            <div class="form-group">
              <label for="email">Confirm Email:</label>
              <input id="emailConfirm" type="email" name="confirm_email" required>
            </div>
            <div class="form-group">
              <label for="password">Password:</label>
              <input id="password" type="password" name="password" required>
            </div>
            <button type="submit" class="button button-primary full-width space-top" role="button">Create
              Account</button>
          </form>
        </div>
        <div class="center max-width-s space-top">
          <span class="muted">By creating an account, you agree to our </span><a href="{% url 'terms_of_service' %}">Terms</a><span
            class="muted">.</span>
        </div>
        <div class="center max-width-s">
          <span class="muted">Already have an account? </span><a href="{% url 'login' %}">Log In</a>
        </div>
      </div>
      <div class="col-one-half bg-image-05 featured-image"></div>
    </section>

  </main>

  <script src="{% static 'website/js/main.js' %}"></script>
</body>

</html>
