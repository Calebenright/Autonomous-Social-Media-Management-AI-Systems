<!-- login.html -->
{% load static %}

<!doctype html>
<html lang="en">

<head>
  <title>Log In | Feadl.io</title>
  <meta charset="utf-8">
  <meta name="description"
   content="An Autonomous, AI driven, marketing and social media web based application.">
  <meta name="viewport" content="width=device-width">
  <link rel="apple-touch-icon-precomposed" href="{% static 'website/media/favicon.png' %}">
  <link rel="icon" href="{% static 'website/media/favicon.png' %}">
  <link rel="mask-icon" href="{% static 'website/media/favicon.svg' %}" color="rgb(36,38,58)">
  <link rel="shortcut icon" href="{% static 'website/media/favicon.png' %}">
  <link rel="stylesheet" href="{% static 'website/css/main.css' %}">
</head>

<body class="page page-onboarding preload">
  <main>

    <a href="{% url 'index' %}" class="button button-close" role="button"></a>

    <section class="row no-gutter reverse-order">
      <div class="col-one-half middle padding">
        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li class="{{ message.tags }} {% if message.tags == 'info' %}info-message{% endif %}" data-message-id="{{ forloop.counter }}">
                    {{ message }}
                    <span class="closebtn" onclick="closeMessage(this);">&times;</span>
                </li>
            {% endfor %}
        </ul>
        {% endif %}    
      
        <div class="max-width-s">

          <h1>Feadl.io</h1>
          <p class="paragraph">Welcome back to your Feadl.io!</p>
          <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group">
              <label for="email">Email:</label>
              <input id="email" type="text" name="email" required>
            </div>
            <div class="form-group">
              <label for="password">Password:</label>
              <input id="password" type="password" name="password" required>
              <a href="{% url 'forgot_password' %}" class="form-help">Forgot password?</a>
            </div>
            <div class="form-group">
              <input id="remember-me" type="checkbox" name="remember-me">
              <label for="remember-me" class="checkbox">Remember Me</label>
            </div>
            <button type="submit" class="button button-primary full-width" role="button">Log In</button>
          </form>
          <!-- <button id="google-sign-in">Sign in with Google</button>
          <button id="facebook-sign-in">Sign in with Facebook</button> -->
        </div>
        <div class="center max-width-s space-top">
          <span class="muted">Don't have an account?   </span><a href="{% url 'signup' %}">Sign Up</a>
          <br>
          <span class="muted">Forgot Your Password?   </span><a href="{% url 'forgot_password' %}">Reset Password</a>
        </div>
      </div>
      <div class="col-one-half bg-image-04 featured-image"></div>
    </section>

  </main>
    <!-- <script type="module" src="{% static 'dashboard/js/pages/login.init.js' %}"></script> -->
    <script src="{% static 'website/js/main.js' %}"></script>
</body>

</html>
