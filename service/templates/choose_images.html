{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Choose Images | Feadl.io</title>
    <meta name="description" content="The Social Media Guy - How social media management should work.">
    <meta name="keywords" content="The Social Media Guy, SMM, Social Media marketing">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://www.feadl.io/">
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'website/media/favicon-32.ico' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'website/media/favicon-16.ico' %}">
    <link rel="manifest" href="{% static 'website/media/seo/site.webmanifest' %}">
    <link rel="shortcut icon" href="{% static 'website/media/favicon.ico' %}">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="msapplication-config" content="{% static 'website/media/browserconfig.xml' %}">
    <meta name="theme-color" content="#ffffff">
  
    <link rel="stylesheet" href="{% static 'website/css/main.css' %}">
  
    <meta property="og:type" content="website">
    <meta property="og:title" content="The Social Media Guy">
    <meta property="og:description" content="The Social Media Guy - How social media management should work.">
    <meta property="og:image" content="{% static 'website/media/seo/og-image.png' %}">
    <meta property="og:image:alt" content="The Social Media Guy">
    <meta property="og:url" content="https://www.feadl.io/">
    <meta property="og:site_name" content="Feadlio">
    <meta property="og:locale" content="en_US">
  
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="The Social Media Guy">
    <meta name="twitter:description" content="The Social Media Guy - How social media management should work.">
    <meta name="twitter:image" content="{% static 'website/media/seo/twitter-image.png' %}">
    <meta name="twitter:image:alt" content="The Social Media Guy">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3a8a;
            font-family: 'Poppins', sans-serif;
            color: white;
            text-align: center;
        }
        .logo {
            width: 100px;
            height: auto;
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
        }
        .content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        button {
            background-color: white;
            color: #2c3a8a;
            border: none;
            border-radius: 50px;
            padding: 10px 20px;
            text-transform: uppercase;
            cursor: pointer;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
            margin-top: 20px;
        }
        
        .image-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .image-wrapper {
            position: relative;
            margin: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            cursor: pointer;
        }

        .image-wrapper img {
            width: 100%;
            max-height: 25vh;
            display: block;
            transition: transform 0.3s, border 0.3s;
        }

        .image-wrapper:hover img {
            transform: scale(1.05);
        }

        .image-wrapper.selected {
            border: 3px solid green;
        }

        .submit-btn {
            cursor: not-allowed;
            width: 30%;
        }

        .submit-btn.enabled {
            cursor: pointer;
        }
    </style>

    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-K42FBSFS');</script>
    <!-- End Google Tag Manager -->
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K42FBSFS"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
       
    <div class="content">
        <style>
            .card {
                background: linear-gradient(to bottom right, #1a2747, #121314);
                padding: 30px;
                border-radius: 15px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
                text-align: center;
                margin: 30px;
            }
            h6 {
                text-align: center;
            }
        </style>
        <div class="card">
            <h3>Choose at least 2 images for your media library!</h3>
            <br>
            {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="{{ message.tags }}" data-message-id="{{ forloop.counter }}">
                        {{ message }}
                        <span class="closebtn" onclick="closeMessage(this);">&times;</span>
                    </li>
                {% endfor %}
            </ul>
            {% endif %}     
            <form id="imageForm" method="POST" action="{% url 'service:choose_images' %}">
                {% csrf_token %}
                <div class="image-container">
                    {% for image in user_settings.ftue_images %}
                    <div class="image-wrapper" onclick="toggleSelection(this)">
                        <img src="{{ image }}" alt="Image {{ forloop.counter }}">
                    </div>
                    {% endfor %}
                </div>
                <input type="hidden" name="selectedImages" id="selectedImages" value="[]">
                <button type="submit" id="submitBtn" class="button button-primary space-top submit-btn" role="button" onclick="showSpinner()" disabled>Add Images</button>
            </form>
            <script>
                function toggleSelection(wrapperElement) {
                    wrapperElement.classList.toggle('selected');
                    updateSelectedImages();
                }
        
                function updateSelectedImages() {
                    const selectedImages = [];
                    document.querySelectorAll('.image-wrapper.selected img').forEach(img => {
                        selectedImages.push(img.src);
                    });
        
                    document.getElementById('selectedImages').value = JSON.stringify(selectedImages);
                    const submitBtn = document.getElementById('submitBtn');
                    if (selectedImages.length > 1) {
                        submitBtn.disabled = false;
                        submitBtn.classList.add('enabled');
                    } else {
                        submitBtn.disabled = true;
                        submitBtn.classList.remove('enabled');
                    }
                }
            </script>
        </div>
    </div>
    <div id="loading-overlay">
        <div class="spinner-grow text-info" role="status"></div>
    </div>
    <style>
        #loading-overlay {
            position: fixed;
            display: none;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.4); /* Semi-transparent background */
            justify-content: center;
            align-items: center;
            z-index: 9999; /* Ensure it is on top of other elements */
        }

        .spinner-grow {
            width: 3rem;
            height: 3rem;
            border: 0.4rem solid transparent;
            color: #174ab8;
            border-radius: 50%;
            animation: spin 1s linear infinite, grow 1.5s ease-in-out infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes grow {
            0%, 100% { transform: scale(0.8); }
            50% { transform: scale(1.2); }
        }

        @media (max-width: 600px) {
            .submit-btn {
                font-size: 13px;
                width: 50%;
            }

            .image-wrapper {
                margin: 3px;
                border-radius: 3px;
            }

            .image-wrapper img {
                width: 100%;
                max-height: 10vh;
                display: block;
                transition: transform 0.3s, border 0.3s;
            }

            .card {
                margin: 10px;
                padding: 10px;
            }
        }

    </style>
    <script>
    function showSpinner() {
        var loadingOverlay = document.getElementById('loading-overlay');
        loadingOverlay.style.display = 'flex';
        document.getElementById('imageForm').submit()
    }
    </script>
    <script src="{% static 'website/js/main.js' %}"></script>
</body>
</html>
