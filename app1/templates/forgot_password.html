{% load static %}
<!doctype html>
<html lang="en">
<head>
  <title>Forgot Password | FeedAI</title>
  <meta charset="utf-8">
  <meta name="description" content="A minimal and responsive HTML5 landing page built on lightweight, clean and customizable code.">
  <meta name="viewport" content="width=device-width">
  <link rel="apple-touch-icon-precomposed" href="{% static 'website/media/favicon.png' %}">
  <link rel="icon" href="{% static 'website/media/favicon.png' %}">
  <link rel="mask-icon" href="{% static 'website/media/favicon.svg' %}" color="rgb(36,38,58)">
  <link rel="shortcut icon" href="{% static 'website/media/favicon.png' %}">
  <link rel="stylesheet" href="{% static 'website/css/main.css' %}">
</head>
<body class="page page-onboarding preload">

  <main>

    <a href="{% url 'index' %}" class="button button-close" role="button"></a>

    <section class="row no-gutter reverse-order">
      <div class="col-one-half middle padding">
        <div class="max-width-s">
          <h1>FeedAI</h1>
          <h5>Forgot password?</h5>
          <p class="paragraph">We'll send you an email with instructions to reset it.</p>
          <form method="post">
            {% csrf_token %}
            <div class="form-group">
              <label for="email">Email:</label>
              <input id="email" type="email" name="email">
            </div>
            <button type="submit" class="button button-primary full-width space-top">Forgot Password</button>
          </form>
        </div>
        <div class="center max-width-s space-top">
          <span class="muted">Already have an account? </span><a href="{% url 'login' %}">Log In</a>
        </div>
      </div>
      <div class="col-one-half bg-image-06 featured-image"></div>
    </section>

  </main>

  <script src="{% static 'website/css/main.css' %}"></script>
</body>
</html>
