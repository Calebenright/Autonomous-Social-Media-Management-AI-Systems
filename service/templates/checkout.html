{% extends "service_base.html" %}

{% block title %}Billing{% endblock %}
{% block name %}Billing{% endblock %}

{% block content %}
    {% load static %}
    <div class="content">
        <div class="container-fluid">

            <style>
                .lock-overlay {
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    z-index: 9997;
                }

                .lock-overlay-content {
                    text-align: center; /* Center text inside */
                }

                .left-side-menu {
                    z-index: 9999;
                }
                .navbar-custom {
                    z-index: 9998;
                }
            </style>
            <div class="lock-overlay">
                <div class="lock-overlay-content">
                    <img src="{% static 'service/media/payment.png' %}" alt="Upgrade Plan" style="width: 400px;">
                    <br>
                    <button id="checkout-button" class="btn btn-gradient-stroke subscribe rounded-pill dropdown-toggle arrow-none waves-effect waves-light mb-3">Go to billing</button>
                </div>
            </div>

            <div class="row">

            </div>
        </div> <!-- container-fluid -->
    </div> <!-- content -->
    <script src="https://js.stripe.com/v3/"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        var stripeKey = 'pk_live_51N3DeEAy1fGRWtyhxwVX6U0p08QZ0iZqnAKlzWpOgScJZQfMbtmQjxhYddqLrKMadth9LKxQPfJp8iGoLvQeVHoP00Fy2GlpzL'
        var stripe = Stripe(stripeKey);

        document.getElementById('checkout-button').addEventListener('click', function(e) {
            e.preventDefault();

            fetch(`/create-checkout-session/30_DOLLAR_MONTHLY_PRICE_ID/`, {
                method: 'POST',
            })
            .then(response => response.json())
            .then(session => stripe.redirectToCheckout({ sessionId: session.sessionId }))
            .catch(error => console.error('Error:', error));
        });
    });
    </script>

{% endblock %}

{% block scripts %}
{% endblock %}
